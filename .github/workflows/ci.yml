name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(curl -fsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          docs_only=false
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do is_doc "$f" || { docs_only=false; why="code path: $f"; break; }; done <<<"$list"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Build & Test
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        go-version: ["1.27"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: memdb-go/go.sum

      - name: Download modules
        working-directory: memdb-go
        run: go mod download

      - name: Build
        working-directory: memdb-go
        run: go build ./...

      - name: Test (race)
        working-directory: memdb-go
        run: go test -count=1 ./...

  lint:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: memdb-go/go.mod
          cache: true
          cache-dependency-path: memdb-go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: memdb-go

  livepg:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    name: Live Postgres Integration (livepg)
    runs-on: ubuntu-24.04-arm

    # NOTE: The composite test-pg image (pgvector + AGE 1.6.0 prebuilt) must be
    # built and pushed manually (or via a separate workflow) before this job can
    # use it. See Dockerfile.test-pg at the repo root for the build recipe. The
    # GHCR namespace (anatolykoptev) is the repo owner; operators can retarget
    # by updating the `image:` field below.
    services:
      postgres:
        image: ghcr.io/anatolykoptev/memdb-test-pg:pg17-age1.6.0
        env:
          POSTGRES_USER: memos
          POSTGRES_PASSWORD: memos
          POSTGRES_DB: memos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memos -d memos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
      MEMDB_LIVE_PG_DSN: postgres://memos:memos@127.0.0.1:5432/memos?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: memdb-go/go.mod
          cache: true
          cache-dependency-path: memdb-go/go.sum

      - name: Download modules
        working-directory: memdb-go
        run: go mod download

      - name: Install extensions
        run: |
          # AGE is prebuilt into the composite test-pg image; only the CREATE
          # EXTENSION statements remain (run inside the service container).
          PG_CID=$(docker ps -q | head -1)
          docker exec "$PG_CID" psql -U memos -d memos -c "CREATE EXTENSION IF NOT EXISTS age;"
          docker exec "$PG_CID" psql -U memos -d memos -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec "$PG_CID" psql -U memos -d memos -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Test (livepg)
        working-directory: memdb-go
        run: |
          # db.NewPostgres calls RunMigrations internally, so each test
          # that connects via MEMDB_LIVE_PG_DSN auto-applies migrations.
          # The extensions (age, vector, pg_trgm) must be installed first.
          go test -tags=livepg -count=1 -v ./internal/handlers/... ./internal/scheduler/... ./internal/search/... ./internal/db/...

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
