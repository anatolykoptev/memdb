name: Release Please

on:
  push:
    branches: [main]
    tags:
      - "memdb-go-v*"
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true

  # release-please creates tags as memdb-go-vX.Y.Z (component-vX.Y.Z format).
  # Go proxy for subdir modules expects memdb-go/vX.Y.Z (slash, not dash).
  # This job renames the tag post-release so `go get` can find it.
  # Triggers on tag push (when release-please merges the release PR → tag created).
  rename-tag:
    if: startsWith(github.ref, 'refs/tags/memdb-go-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Rename tag (dash → slash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TAG: ${{ github.ref_name }}
        run: |
          NEW_TAG="${OLD_TAG/-v//}"
          echo "Renaming $OLD_TAG → $NEW_TAG"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" tmp
          cd tmp
          git tag "$NEW_TAG" "$OLD_TAG"
          git push origin "$NEW_TAG"
          git push origin --delete "$OLD_TAG"
          cd ..
          rm -rf tmp

  # goreleaser builds prebuilt binaries + archives for the GitHub Release.
  # Gated on release-please having created a release (tag + GitHub Release exist).
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: memdb-go/go.mod
          cache: true
          cache-dependency-path: memdb-go/go.sum

      - name: Download modules
        working-directory: memdb-go
        run: go mod download

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}
