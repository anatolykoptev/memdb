name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Mint a short-lived installation token from the krolik-release-bot
      # GitHub App so the release PRs and tags are created by the App,
      # not the default GITHUB_TOKEN. Tags created with GITHUB_TOKEN do
      # NOT trigger downstream workflows (GitHub Actions limitation).
      # The App token DOES trigger tag-push workflows → goreleaser runs.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
