name: Goreleaser

# Triggered by tag push from release-please (memdb-go/vX.Y.Z).
# Tags created with the GitHub App token (not GITHUB_TOKEN) DO trigger
# downstream workflows — that's why release-please.yml uses the App.
on:
  push:
    tags:
      - "memdb-go/v*"
  workflow_dispatch:

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: memdb-go/go.mod
          cache: true
          cache-dependency-path: memdb-go/go.sum

      - name: Download modules
        working-directory: memdb-go
        run: go mod download

      # Free goreleaser can't parse prefixed tags (monorepo = Pro-only).
      # Strip the memdb-go/ prefix from the tag so goreleaser sees v0.23.1.
      # Snapshot mode skips tag validation; we upload to the existing release.
      - name: Strip tag prefix for goreleaser
        id: tag
        run: echo "version=${GITHUB_REF_NAME#memdb-go/}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
          workdir: memdb-go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.version }}

      - name: Rename archives (strip -SNAPSHOT-<sha> suffix)
        working-directory: memdb-go/dist
        run: |
          # goreleaser --snapshot appends -SNAPSHOT-<sha> to filenames.
          # memdb_0.23.1-SNAPSHOT-abc123_linux_amd64.tar.gz
          # → memdb_0.23.1_linux_amd64.tar.gz
          for f in *-SNAPSHOT-*_*.tar.gz; do
            base="${f%%-SNAPSHOT-*}"
            rest="${f#*_}"
            os_arch="${rest#*_}"
            new="${base}_${os_arch}"
            echo "  $f → $new"
            mv "$f" "$new"
          done

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd memdb-go/dist
          gh release upload "$TAG" *.tar.gz checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
