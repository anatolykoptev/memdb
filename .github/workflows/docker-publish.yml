name: Publish Docker Image

on:
  push:
    # This workflow builds ./memdb-go/Dockerfile — the Go service image — so
    # it triggers on the GO component's release tags (release-please cuts
    # memdb-go/vX.Y.Z; the dash form covers any legacy scheme). Root-component
    # tags (bare vX.Y.Z) must NOT build this image: on 2026-07-19 the root
    # v0.25.1 tag published the Go image mislabeled 0.25.1 while memdb-go was
    # actually 0.23.1.
    tags:
      - 'memdb-go/v*'
      - 'memdb-go-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # type=semver cannot parse the component-prefixed tag
            # (memdb-go/v0.23.1) — extract the version by match instead.
            type=match,pattern=v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=v(\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MemDB
            org.opencontainers.image.description=Memory Database for AI Agents — self-hosted, Go + Postgres (pgvector + Apache AGE)
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: ./memdb-go
          file: ./memdb-go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
