version: 2

project_name: memdb

# release-please creates the GitHub Release; goreleaser only builds artifacts.
# We run in --snapshot mode (free goreleaser can't parse prefixed tags like
# memdb-go/vX.Y.Z — monorepo tag stripping is Pro-only), then upload
# artifacts to the existing release-please release via gh release upload.
release:
  disable: true

builds:
  - id: mcp-server
    main: ./cmd/mcp-server
    binary: memdb-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

  - id: mcp-stdio-proxy
    main: ./cmd/mcp-stdio-proxy
    binary: mcp-stdio-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
